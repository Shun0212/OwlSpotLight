name: Verify Owl Diff Search

on:
  push:
    branches: [codex/owl-diff-search-standalone]
  workflow_dispatch:

defaults:
  run:
    working-directory: standalone/owl-diff-search

permissions:
  contents: read

concurrency:
  group: owl-diff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: python -m pip install -r backend/requirements-parsers.txt
      - run: python -m unittest discover -s backend/tests -p "test_*.py" -v
      - run: npm test
      - run: xvfb-run -a npm run test:extension
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: owl-diff-search-vsix
          path: 'standalone/owl-diff-search/*.vsix'
          if-no-files-found: error

  semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r backend/requirements.txt
      - run: python backend/tests/semantic_smoke.py
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          DO_NOT_TRACK: '1'
          OWL_PROGRESS: '0'
